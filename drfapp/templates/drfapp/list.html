<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capitals — List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/app/list/">Capitals</a>
        <div>
          <a class="btn btn-outline-light" href="/app/create/">Create</a>
        </div>
      </div>
    </nav>
    <main class="container my-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title mb-0">All capitals</h5>
            <input id="filter" type="search" class="form-control w-auto" placeholder="Filter by city..." />
          </div>
          <div id="alert" class="alert alert-danger d-none" role="alert"></div>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>City</th>
                  <th>Population</th>
                  <th>Author</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div id="spinner" class="text-center py-4">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
          </div>
        </div>
      </div>
    </main>

    <script>
      let allData = [];
      function showError(msg) {
        $('#alert').removeClass('d-none').text(msg);
      }
      function setLoading(isLoading) {
        $('#spinner').toggleClass('d-none', !isLoading);
      }
      function renderRows(rows) {
        const $tb = $('#tbody').empty();
        rows.forEach(function(item){
          const $tr = $('<tr/>');
          $('<td/>').text(item.capital_city).appendTo($tr);
          $('<td/>').text(item.capital_population).appendTo($tr);
          $('<td/>').text(item.author).appendTo($tr);
          $tb.append($tr);
        });
      }
      function applyFilter() {
        const q = $('#filter').val().toLowerCase();
        const rows = !q ? allData : allData.filter(x => x.capital_city.toLowerCase().includes(q));
        renderRows(rows);
      }
      function load() {
        setLoading(true);
        $('#alert').addClass('d-none');
        $.get('/api/capitals/')
          .done(function(data){ allData = data; renderRows(allData); })
          .fail(function(xhr){ showError(xhr.responseText || 'Failed to load'); })
          .always(function(){ setLoading(false); });
      }
      $(function(){
        $('#filter').on('input', applyFilter);
        load();
      })
    </script>
  </body>
  </html>
