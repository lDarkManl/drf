<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capitals — Create</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/app/list/">Capitals</a>
        <div>
          <a class="btn btn-outline-light" href="/app/list/">List</a>
        </div>
      </div>
    </nav>
    <main class="container my-4">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Create capital</h5>
              <div id="alert" class="alert d-none" role="alert"></div>
              <form id="create-form" class="row g-3 needs-validation" novalidate>
                <div class="col-md-6">
                  <label for="country" class="form-label">Country</label>
                  <input id="country" class="form-control" required />
                  <div class="invalid-feedback">Please provide a country</div>
                </div>
                <div class="col-md-6">
                  <label for="capital_city" class="form-label">Capital city</label>
                  <input id="capital_city" class="form-control" required />
                  <div class="invalid-feedback">Please provide a city</div>
                </div>
                <div class="col-md-6">
                  <label for="capital_population" class="form-label">Population</label>
                  <input id="capital_population" type="number" min="0" class="form-control" required />
                  <div class="invalid-feedback">Please provide a non-negative number</div>
                </div>
                <div class="col-md-6">
                  <label for="author" class="form-label">Author username</label>
                  <input id="author" class="form-control" required />
                  <div class="invalid-feedback">Please provide an author</div>
                </div>
                <div class="col-12 d-flex gap-2">
                  <button type="submit" class="btn btn-primary">Save</button>
                  <a href="/app/list/" class="btn btn-outline-secondary">Cancel</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      (function () {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms).forEach(function (form) {
          form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
              event.preventDefault()
              event.stopPropagation()
            }
            form.classList.add('was-validated')
          }, false)
        })
      })()

      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
      }
      function setAlert(kind, msg) {
        const $a = $('#alert');
        $a.removeClass('d-none alert-success alert-danger').addClass('alert-' + kind).text(msg);
      }
      $(function(){
        $('#create-form').on('submit', function(e){
          if (!this.checkValidity()) return;
          e.preventDefault();
          const payload = {
            country: $('#country').val(),
            capital_city: $('#capital_city').val(),
            capital_population: Number($('#capital_population').val()),
            author: $('#author').val()
          };
          setAlert('success', '');
          $.ajax({
            url: '/api/capitals/',
            method: 'POST',
            data: JSON.stringify(payload),
            contentType: 'application/json',
            headers: { 'X-CSRFToken': getCookie('csrftoken') }
          })
          .done(function(){
            setAlert('success', 'Created successfully');
            setTimeout(function(){ window.location.href = '/app/list/'; }, 800);
          })
          .fail(function(xhr){ setAlert('danger', xhr.responseText || 'Failed to create'); });
        })
      })
    </script>
  </body>
  </html>
